apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: campus-shuttle
data:
  prometheus.yml: |
    global:
      scrape_interval: 3s
      evaluation_interval: 3s

    scrape_configs:
      - job_name: 'fastapi-shuttle-backend'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['backend-service:8000']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: campus-shuttle
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: campus-shuttle
  labels:
    app: prometheus
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
  selector:
    app: prometheus

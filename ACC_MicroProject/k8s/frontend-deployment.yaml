apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: campus-shuttle
  labels:
    app: shuttle-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shuttle-frontend
  template:
    metadata:
      labels:
        app: shuttle-frontend
    spec:
      containers:
        - name: frontend
          image: shuttle-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: campus-shuttle
  labels:
    app: shuttle-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: shuttle-frontend
